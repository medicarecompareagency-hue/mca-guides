name: Compliance and build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Compliance gate runs BEFORE the build. A article that fails this
      # never reaches Vercel.
      - run: npm run check
      - run: npm run build
